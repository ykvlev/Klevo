<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KLEVO — КАРТА ТОЧЕК</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css">
  <style>
    :root {
      --color-ember-rust: #cc6437;
      --color-void-black: #0b0b0b;
      --color-charcoal-surface: #272a2a;
      --color-bone: #edebe7;
      --color-bone-darker: #dfddd9;
      --color-pure-white: #ffffff;
      --color-abyss: #050505;
      --color-steel: #484848;
      --color-ash: #cecece;

      --font-pragmatica-cond: 'Barlow Condensed', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-pragmatica: 'Inter', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-roboto-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --text-caption: 11px;
      --text-body-sm: 14px;
      --text-heading-sm: 20px;
      --text-heading: 24px;
      --text-heading-lg: 32px;
      --tracking: -0.02em;

      --spacing-5: 5px; --spacing-8: 8px; --spacing-11: 11px; --spacing-16: 16px;
      --spacing-20: 20px; --spacing-24: 24px; --spacing-32: 32px; --spacing-40: 40px;

      --radius-cards: 10px;
      --radius-full-2: 1440px;

      --page-max-width: 1400px;
    }

    * { box-sizing: border-box; }
    html { background: var(--color-void-black); }
    body {
      margin: 0;
      background: var(--color-void-black);
      color: var(--color-pure-white);
      font-family: var(--font-pragmatica-cond);
      font-weight: 400;
      letter-spacing: var(--tracking);
      line-height: 1.43;
      text-transform: uppercase;
    }

    .newsbar {
      background: var(--color-abyss);
      border-bottom: 1px solid var(--color-charcoal-surface);
      padding: 10px 20px;
      font-family: var(--font-roboto-mono);
      font-size: var(--text-caption);
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      color: var(--color-ash);
    }
    .newsbar b { color: var(--color-pure-white); font-weight: 400; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-20);
      padding: 40px 32px 24px;
      border-bottom: 1px solid var(--color-charcoal-surface);
    }
    .brand { font-size: var(--text-heading-lg); line-height: 1.05; letter-spacing: -0.02em; }
    .brand .dot { color: var(--color-ember-rust); }
    .hdr-right { display: flex; align-items: baseline; gap: var(--spacing-20); }
    .hdr-meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); letter-spacing: -0.02em; text-transform: uppercase; }

    nav.pills { display: flex; gap: var(--spacing-8); }
    nav.pills a {
      text-decoration: none;
      border: 1px solid var(--color-steel);
      border-radius: var(--radius-full-2);
      padding: 5px 14px;
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      color: var(--color-ash);
      text-transform: uppercase;
    }
    nav.pills a:hover { color: var(--color-pure-white); border-color: var(--color-pure-white); }
    nav.pills a.active { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }

    main { max-width: var(--page-max-width); margin: 0 auto; padding: 40px 32px; }

    .mapgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .mapcol { display: grid; gap: 20px; }
    @media (max-width: 860px) { .mapgrid { grid-template-columns: 1fr; } }

    .card {
      background: var(--color-charcoal-surface);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-charcoal-surface);
      padding: var(--spacing-24);
      box-shadow: none;
    }
    .card-head { display: flex; align-items: center; gap: var(--spacing-11); margin-bottom: var(--spacing-20); }
    .card-head h2 { margin: 0; font-size: var(--text-heading-sm); line-height: 1; letter-spacing: -0.02em; font-weight: 400; }

    .badge {
      display: inline-block;
      border: 1px solid var(--color-ash);
      border-radius: var(--radius-full-2);
      padding: 5px 11px;
      font-size: var(--text-body-sm);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--color-pure-white);
      text-transform: uppercase;
    }
    .badge.rust { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }
    .badge.off { opacity: 0.35; }

    #map { height: 520px; border-radius: var(--radius-cards); border: 1px solid var(--color-steel); background: var(--color-void-black); z-index: 0; }
    @media (max-width: 860px) { #map { height: 55vh; } }

    .leaflet-container { font-family: var(--font-pragmatica-cond); letter-spacing: -0.02em; text-transform: uppercase; background: var(--color-void-black); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--color-charcoal-surface); color: var(--color-pure-white); }
    .leaflet-popup-content-wrapper { border: 1px solid var(--color-steel); border-radius: var(--radius-cards); }
    .leaflet-popup-content { margin: 16px 20px; }
    .leaflet-container a.leaflet-popup-close-button { color: var(--color-ash); }
    .leaflet-container a.leaflet-popup-close-button:hover { color: var(--color-pure-white); }
    .leaflet-control-zoom a { background: var(--color-charcoal-surface); color: var(--color-pure-white); border-color: var(--color-steel); }
    .leaflet-control-zoom a:hover { background: var(--color-void-black); }
    .leaflet-control-attribution { background: var(--color-abyss); color: var(--color-ash); font-family: var(--font-roboto-mono); font-size: 10px; }
    .leaflet-control-attribution a { color: var(--color-ash); }
    .leaflet-bar { border: 1px solid var(--color-steel); }

    .pp { line-height: 1.4; }
    .pp .pp-name { font-size: var(--text-heading-sm); letter-spacing: -0.02em; }
    .pp .pp-meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); letter-spacing: -0.02em; text-transform: uppercase; margin-top: 4px; }
    .pp .pp-meta b { color: var(--color-pure-white); font-weight: 400; }
    .pp .pp-score { display: flex; align-items: center; gap: var(--spacing-16); margin-top: 12px; }
    .pp .pp-score .num { font-size: var(--text-heading); line-height: 1; letter-spacing: -0.02em; }
    .pp .pp-score .bar { display: flex; gap: 3px; flex: 1; }
    .pp .pp-score .bar i { flex: 1; height: 14px; border: 1px solid var(--color-steel); border-radius: var(--radius-full-2); }
    .pp .pp-score .bar i.on { border-color: var(--color-ember-rust); }
    .pp .pp-score .bar i.on::after { content: "•"; display: block; text-align: center; color: var(--color-ember-rust); font-size: 9px; line-height: 12px; }
    .pp .pp-note { font-family: var(--font-pragmatica); font-size: 13px; line-height: 1.4; text-transform: none; color: var(--color-ash); margin-top: 10px; }

    .spotrow {
      display: flex; align-items: baseline; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid var(--color-charcoal-surface); cursor: pointer;
    }
    .spotrow:last-child { border-bottom: 0; }
    .spotrow .sn { font-size: var(--text-body-sm); letter-spacing: -0.02em; }
    .spotrow .wt { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); letter-spacing: -0.02em; }
    .spotrow .sc { margin-left: auto; font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-ash); }
    .spotrow:hover .sn { color: var(--color-pure-white); }
    .spotrow.sel .sn { color: var(--color-ember-rust); }

    .meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-ash); margin: 4px 0; text-transform: uppercase; }
    .meta b { color: var(--color-pure-white); font-weight: 400; }
    .meta .rust { color: var(--color-ember-rust); }
    .note { margin-top: 12px; font-family: var(--font-pragmatica); font-size: 14px; text-transform: none; color: var(--color-ash); }

    .score { display: flex; align-items: center; gap: var(--spacing-20); margin: 8px 0 16px; }
    .score .num { font-size: var(--text-heading-lg); line-height: 1.05; letter-spacing: -0.02em; }
    .score .bar { display: flex; gap: 4px; flex: 1; }
    .score .bar i { flex: 1; height: 18px; border: 1px solid var(--color-steel); border-radius: var(--radius-full-2); }
    .score .bar i.on { border-color: var(--color-ember-rust); }
    .score .bar i.on::after { content: "•"; display: block; text-align: center; color: var(--color-ember-rust); font-size: 11px; line-height: 16px; }

    .btn {
      display: inline-block; cursor: pointer; text-decoration: none;
      background: transparent;
      border: 1px solid var(--color-pure-white);
      border-radius: var(--radius-full-2);
      padding: 10px 20px;
      margin: 16px 8px 0 0;
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      color: var(--color-pure-white);
      text-transform: uppercase;
    }
    .btn:hover { color: var(--color-void-black); background: var(--color-pure-white); }

    .empty { color: var(--color-ash); font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; padding: 12px 0; }

    label { display: block; margin: 16px 0 6px; font-size: var(--text-body-sm); color: var(--color-ash); letter-spacing: -0.02em; }
    input[type=date] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-steel);
      border-radius: var(--radius-cards);
      background: var(--color-void-black);
      color: var(--color-pure-white);
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      outline: none;
    }
    input[type=date]:focus { border-color: var(--color-ash); }

    .zone-rules { margin-top: 16px; border-top: 1px solid var(--color-steel); padding-top: 12px; }
    .zone-rules .mini { font-family: var(--font-pragmatica); font-size: 13px; line-height: 1.4; text-transform: none; color: var(--color-ash); }
    .zone-rules .mini b { color: var(--color-pure-white); font-weight: 400; }
  </style>
</head>
<body>
  <div class="newsbar"><b>KLEVO</b> • AI-ПРОГНОЗ КЛЁВА • ИНСПЕКТОР УЛОВА • ЗАПАДНЫЙ БАССЕЙН • ЛЕНОБЛАСТЬ • ПИЛОТ 2026</div>

  <header>
    <div class="brand">KLEVO<span class="dot">.</span></div>
    <div class="hdr-right">
      <nav class="pills">
        <a href="/">ЖУРНАЛ</a>
        <a href="/map.html" class="active">КАРТА</a>
        <a href="/feed.html">ЛЕНТА</a>
      </nav>
      <div class="hdr-meta">КАРТА ТОЧЕК · ФАЗА 4.5</div>
    </div>
  </header>

  <main>
    <div class="mapgrid">
      <div class="mapcol">
        <section class="card">
          <div class="card-head"><span class="badge">01</span><h2>КАРТА ТОЧЕК</h2></div>
          <div id="map"><div class="empty">ЗАГРУЗКА КАРТЫ…</div></div>
        </section>

        <section class="card">
          <div class="card-head"><span class="badge">02</span><h2>СПИСОК ТОЧЕК</h2></div>
          <div id="spotlist"><div class="empty">ЗАГРУЗКА…</div></div>
        </section>
      </div>

      <div class="mapcol">
        <section class="card">
          <div class="card-head"><span class="badge">03</span><h2>ВЫБРАННАЯ ТОЧКА</h2></div>
          <label for="mapDate">ДАТА ПРОГНОЗА</label>
          <input type="date" id="mapDate">
          <div id="detail"><div class="empty">ВЫБЕРИТЕ ТОЧКУ НА КАРТЕ ИЛИ В СПИСКЕ</div></div>
        </section>
      </div>
    </div>
  </main>

  <script src="/lib/leaflet/leaflet.js"></script>
  <script>
    const WT = { river: "РЕКА", lake: "ОЗЕРО", sea: "МОРЕ / ЗАЛИВ" };
    const WT_COLOR = { river: "#cc6437", lake: "#dfddd9", sea: "#cecece" };
    const WT_LETTER = { river: "r", lake: "l", sea: "s" };

    let spots = [], markers = new Map(), map = null, current = null;

    async function get(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function localISO(dt) {
      const p = n => String(n).padStart(2, "0");
      return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
    }

    function pinSvg(color, letter, sel) {
      const r = sel ? 9 : 7;
      return `<svg width="${r * 2}" height="${r * 2}" viewBox="0 0 ${r * 2} ${r * 2}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${r}" cy="${r}" r="${r}" fill="${sel ? "#ffffff" : color}" stroke="${sel ? color : "#ffffff"}" stroke-width="1.5"/>
        <text x="${r}" y="${r + 1}" font-family="monospace" font-size="${Math.round(r * 1.4)}" font-weight="bold"
          fill="${sel ? color : "#ffffff"}" text-anchor="middle" dominant-baseline="middle">${letter}</text>
      </svg>`;
    }

    function makeIcon(spot, sel) {
      return L.divIcon({
        className: "",
        html: pinSvg(WT_COLOR[spot.waterType] || "#cc6437", WT_LETTER[spot.waterType] || "?", sel),
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
    }

    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function scoreBar(score, segs, cls) {
      return `<div class="${cls}">
        <div class="num">${score}</div>
        <div class="bar">${Array.from({ length: segs }, (_, i) => `<i class="${(i + 1) * (100 / segs) <= score ? "on" : ""}"></i>`).join("")}</div>
      </div>`;
    }

    function popupHtml(spot) {
      return `<div class="pp">
        <div class="pp-name">${esc(spot.name)}</div>
        <div class="pp-meta">${WT[spot.waterType] || spot.waterType} · <b>${esc(spot.region)}</b></div>
        <div id="pp-fc-${spot.id}" class="pp-score"><span class="empty">ЗАГРУЗКА…</span></div>
        <div id="pp-note-${spot.id}"></div>
      </div>`;
    }

    function renderForecast(fc, cls) {
      const start = fc.bestStart || "—", end = fc.bestEnd || "—";
      const what = fc.modelVersion === "ml-v1" ? "ML-МОДЕЛЬ" : "ПРАВИЛА";
      const sat = (fc.satellite || []).map(s =>
        `<div class="meta">• ${esc(s.label).toUpperCase()}: <b>${s.value ?? "—"} ${s.unit}</b> — ${s.basis}${s.estimated ? ` · ДОСТ. ${s.confidence}%` : ""}</div>`).join("");
      return scoreBar(fc.score, 10, cls) +
        `<div class="meta">ДАТА: <b>${fc.date}</b></div>` +
        `<div class="meta">ЛУЧШЕЕ ВРЕМЯ: <b>${start}–${end}</b></div>` +
        `<div class="meta">ИСТОЧНИК: <b>${what}</b> · ${fc.modelVersion}</div>` +
        `<div class="meta">ДОСТОВЕРНОСТЬ: <b>${fc.dataConfidence ?? "—"}%</b></div>` +
        sat +
        `<div class="note">${esc(fc.dataNote || "")}</div>`;
    }

    async function loadForecastInto(id, elId) {
      const el = document.getElementById(elId);
      try {
        const fc = await get(`/api/spots/${id}/forecast?date=${document.getElementById("mapDate").value}`);
        el.innerHTML = renderForecast(fc, "pp-score");
      } catch (e) {
        el.innerHTML = `<div class="meta rust">НЕТ ДАННЫХ ПРОГНОЗА</div>`;
      }
    }

    function selectSpot(id, fly) {
      current = id;
      const spot = spots.find(s => s.id === id);
      document.querySelectorAll(".spotrow").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
      markers.forEach((m, mid) => m.setIcon(makeIcon(spots.find(s => s.id === mid), mid === id)));
      if (fly) map.flyTo([spot.lat, spot.lon], Math.max(map.getZoom(), 10));
      loadDetail(id);
    }

    async function loadDetail(id) {
      const el = document.getElementById("detail");
      const spot = spots.find(s => s.id === id);
      const date = document.getElementById("mapDate").value;
      el.innerHTML = `<div class="empty">ЗАГРУЗКА ДАННЫХ…</div>`;
      let fcHtml = `<div class="meta rust">НЕТ ДАННЫХ ПРОГНОЗА</div>`;
      let zoneHtml = "";
      try {
        const fc = await get(`/api/spots/${id}/forecast?date=${date}`);
        fcHtml = renderForecast(fc, "score");
      } catch (e) { }
      try {
        const zr = await get(`/api/zones/${spot.zoneId}/rules`);
        const sizes = (zr.minSizes || []).slice(0, 6).map(r =>
          `<div class="mini">• <b>${esc(r.species)}</b> — мин. ${r.minSizeCm} см</div>`).join("");
        zoneHtml = `<div class="zone-rules">
          <div class="meta">ЗОНА: <b>${esc(zr.zone.name)}</b> · ${esc(zr.zone.section)}</div>
          ${sizes}
          <a class="btn" href="/?spot=${id}">ОТКРЫТЬ В ЖУРНАЛЕ →</a>
        </div>`;
      } catch (e) { }
      el.innerHTML = `<div class="meta">ТОЧКА · ${WT[spot.waterType] || spot.waterType} · <b>${esc(spot.region)}</b></div>` +
        `<div class="note" style="margin:0 0 8px;">${esc(spot.name)}</div>` +
        fcHtml + zoneHtml;
    }

    function renderList() {
      document.getElementById("spotlist").innerHTML = spots.map(s =>
        `<div class="spotrow" data-id="${s.id}" onclick="selectSpot('${s.id}', true)">
          <span class="sn">${esc(s.name)}</span>
          <span class="wt">${WT[s.waterType] || s.waterType}</span>
          <span class="sc">${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</span>
        </div>`).join("");
    }

    async function init() {
      document.getElementById("mapDate").value = localISO(new Date());
      try {
        spots = await get("/api/spots");
      } catch (e) {
        document.getElementById("spotlist").innerHTML = '<div class="empty">ОШИБКА ЗАГРУЗКИ: ' + esc(e.message) + '</div>';
        return;
      }
      renderList();

      map = L.map("map", { zoomControl: true, attributionControl: true });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: "abcd",
        maxZoom: 19,
      }).addTo(map);

      spots.forEach(s => {
        const m = L.marker([s.lat, s.lon], { icon: makeIcon(s, false), riseOnHover: true })
          .addTo(map)
          .bindPopup(popupHtml(s), { closeButton: true, maxWidth: 300 });
        m.on("popupopen", () => loadForecastInto(s.id, `pp-fc-${s.id}`));
        m.on("click", () => selectSpot(s.id, false));
        markers.set(s.id, m);
      });

      map.fitBounds(spots.map(s => [s.lat, s.lon]), { padding: [40, 40], maxZoom: 11 });
      selectSpot(spots[0].id, false);
    }

    document.getElementById("mapDate").addEventListener("change", () => {
      if (current) loadDetail(current);
      markers.forEach((m, id) => { if (m.isPopupOpen()) loadForecastInto(id, `pp-fc-${id}`); });
    });

    init();
  </script>
</body>
</html>
