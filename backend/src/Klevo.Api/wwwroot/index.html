<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KLEVO — ИНСПЕКТОР УЛОВА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Ciridae — colors */
      --color-ember-rust: #cc6437;
      --color-void-black: #0b0b0b;
      --color-charcoal-surface: #272a2a;
      --color-bone: #edebe7;
      --color-bone-darker: #dfddd9;
      --color-pure-white: #ffffff;
      --color-abyss: #050505;
      --color-steel: #484848;
      --color-ash: #cecece;

      /* Ciridae — typography */
      --font-pragmatica-cond: 'Barlow Condensed', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-pragmatica: 'Inter', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-roboto-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --text-caption: 11px;
      --text-body-sm: 14px;
      --text-heading-sm: 20px;
      --text-heading: 24px;
      --text-heading-lg: 32px;
      --tracking: -0.02em;

      --spacing-5: 5px; --spacing-8: 8px; --spacing-11: 11px; --spacing-16: 16px;
      --spacing-20: 20px; --spacing-24: 24px; --spacing-32: 32px; --spacing-40: 40px;

      --radius-cards: 10px;
      --radius-full-2: 1440px;

      --page-max-width: 1400px;
    }

    * { box-sizing: border-box; }
    html { background: var(--color-void-black); }
    body {
      margin: 0;
      background: var(--color-void-black);
      color: var(--color-pure-white);
      font-family: var(--font-pragmatica-cond);
      font-weight: 400;
      letter-spacing: var(--tracking);
      line-height: 1.43;
      text-transform: uppercase;
    }

    /* ————— system voice: top news bar ————— */
    .newsbar {
      background: var(--color-abyss);
      border-bottom: 1px solid var(--color-charcoal-surface);
      padding: 10px 20px;
      font-family: var(--font-roboto-mono);
      font-size: var(--text-caption);
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      color: var(--color-ash);
    }
    .newsbar b { color: var(--color-pure-white); font-weight: 400; }

    /* ————— header ————— */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--spacing-20);
      padding: 40px 32px 24px;
      border-bottom: 1px solid var(--color-charcoal-surface);
    }
    .brand { font-size: var(--text-heading-lg); line-height: 1.05; letter-spacing: -0.02em; }
    .brand .dot { color: var(--color-ember-rust); }
    .hdr-meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); letter-spacing: -0.02em; text-transform: uppercase; }

    main { max-width: var(--page-max-width); margin: 0 auto; padding: 40px 32px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .col { display: grid; gap: 20px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    /* ————— system cards ————— */
    .card {
      background: var(--color-charcoal-surface);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-charcoal-surface);
      padding: var(--spacing-24);
      box-shadow: none;
    }
    .card-head { display: flex; align-items: center; gap: var(--spacing-11); margin-bottom: var(--spacing-20); }
    .card-head h2 { margin: 0; font-size: var(--text-heading-sm); line-height: 1; letter-spacing: -0.02em; font-weight: 400; }

    /* ————— pill badges ————— */
    .badge {
      display: inline-block;
      border: 1px solid var(--color-ash);
      border-radius: var(--radius-full-2);
      padding: 5px 11px;
      font-size: var(--text-body-sm);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--color-pure-white);
      text-transform: uppercase;
    }
    .badge.rust { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }
    .badge.off { opacity: 0.35; }

    /* ————— forms ————— */
    label { display: block; margin: 16px 0 6px; font-size: var(--text-body-sm); color: var(--color-ash); letter-spacing: -0.02em; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-16); }
    @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-steel);
      border-radius: var(--radius-cards);
      background: var(--color-void-black);
      color: var(--color-pure-white);
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--color-ash); }
    select option { text-transform: none; }
    textarea { font-family: var(--font-pragmatica); text-transform: none; }

    /* ————— ghost pill buttons ————— */
    .btn {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--color-pure-white);
      border-radius: var(--radius-full-2);
      padding: 10px 20px;
      margin: 16px 8px 0 0;
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      color: var(--color-pure-white);
      text-transform: uppercase;
    }
    .btn:hover { color: var(--color-void-black); background: var(--color-pure-white); }
    .btn.ghost-ash { border-color: var(--color-ash); color: var(--color-ash); }
    .btn.ghost-ash:hover { color: var(--color-void-black); background: var(--color-ash); }

    /* ————— score ————— */
    .score { display: flex; align-items: center; gap: var(--spacing-20); margin: 8px 0 16px; }
    .score .num { font-size: var(--text-heading-lg); line-height: 1.05; letter-spacing: -0.02em; }
    .score .bar { display: flex; gap: 4px; flex: 1; }
    .score .bar i { flex: 1; height: 18px; border: 1px solid var(--color-steel); border-radius: var(--radius-full-2); }
    .score .bar i.on { border-color: var(--color-ember-rust); }
    .score .bar i.on::after { content: "•"; display: block; text-align: center; color: var(--color-ember-rust); font-size: 11px; line-height: 16px; }

    .meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-ash); margin: 4px 0; text-transform: uppercase; }
    .meta b { color: var(--color-pure-white); font-weight: 400; }
    .meta .rust { color: var(--color-ember-rust); }
    .note { margin-top: 12px; font-family: var(--font-pragmatica); font-size: 14px; text-transform: none; color: var(--color-ash); }

    /* ————— rule check ————— */
    .verdict { display: flex; align-items: center; gap: var(--spacing-11); margin-bottom: var(--spacing-16); }
    .verdict .txt { font-size: var(--text-heading-sm); line-height: 1; letter-spacing: -0.02em; }
    .verdict .txt.ok { color: var(--color-pure-white); }
    .verdict .txt.viol { color: var(--color-ember-rust); }
    .summary { font-family: var(--font-pragmatica); font-size: 14px; line-height: 1.4; text-transform: none; color: var(--color-ash); margin-bottom: var(--spacing-16); }
    .checkline { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--color-charcoal-surface); align-items: baseline; }
    .checkline:last-child { border-bottom: 0; }
    .checkline .mk { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); }
    .checkline .mk.no { color: var(--color-ember-rust); }
    .checkline .ct { font-size: var(--text-body-sm); letter-spacing: -0.02em; }
    .checkline .cm { display: block; font-family: var(--font-pragmatica); font-size: 13px; line-height: 1.4; text-transform: none; color: var(--color-ash); margin-top: 2px; }

    /* ————— catch table ————— */
    table { width: 100%; border-collapse: collapse; }
    th { font-family: var(--font-roboto-mono); font-size: var(--text-caption); font-weight: 400; letter-spacing: -0.02em; color: var(--color-ash); text-align: left; padding: 8px; border-bottom: 1px solid var(--color-steel); }
    td { font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-pure-white); padding: 10px 8px; border-bottom: 1px solid var(--color-charcoal-surface); vertical-align: top; }
    td.sp { font-family: var(--font-pragmatica-cond); font-size: var(--text-body-sm); letter-spacing: -0.02em; }
    .empty { color: var(--color-ash); font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; padding: 12px 0; }

    input[type=file] { border: 1px dashed var(--color-steel); background: var(--color-void-black); color: var(--color-ash); font-family: var(--font-pragmatica); text-transform: none; cursor: pointer; }
    #photoPreview { display: block; margin: 12px 0 0; max-width: 260px; border-radius: var(--radius-cards); border: 1px solid var(--color-steel); }
    .fidrow { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--color-charcoal-surface); cursor: pointer; }
    .fidrow:last-child { border-bottom: 0; }
    .fidrow .fidname { font-size: var(--text-body-sm); letter-spacing: -0.02em; }
    .fidrow:hover .fidname { color: var(--color-pure-white); }
    .fidrow.sel .fidname { color: var(--color-ember-rust); }
    .fidrow .fidconf { font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-ash); }
    .fidrow .fidtag { margin-left: auto; }
    .thumb { max-width: 56px; border-radius: var(--radius-cards); border: 1px solid var(--color-steel); }

    #msg { margin: 12px 0 0; font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; text-transform: uppercase; min-height: 14px; }
    #msg.ok { color: var(--color-pure-white); }
    #msg.err { color: var(--color-ember-rust); }
  </style>
</head>
<body>
  <div class="newsbar"><b>KLEVO</b> • AI-ПРОГНОЗ КЛЁВА • ИНСПЕКТОР УЛОВА • ЗАПАДНЫЙ БАССЕЙН • ЛЕНОБЛАСТЬ • ПИЛОТ 2026</div>

  <header>
    <div class="brand">KLEVO<span class="dot">.</span></div>
    <div class="hdr-meta">ЖУРНАЛ УЛОВОВ · RULE-CHECK V1</div>
  </header>

  <main>
    <div class="grid">
      <div class="col">
        <section class="card">
          <div class="card-head"><span class="badge">01</span><h2>ТОЧКА</h2></div>
          <label for="spot">ВОДОЁМ / ТОЧКА</label>
          <select id="spot" onchange="onSpot()"><option value="">ЗАГРУЗКА…</option></select>
        </section>

        <section class="card" id="forecastCard" hidden>
          <div class="card-head"><span class="badge">02</span><h2>ПРОГНОЗ КЛЁВА</h2></div>
          <div id="forecast"></div>
        </section>

        <section class="card">
          <div class="card-head"><span class="badge">03</span><h2>ЗАПИСАТЬ УЛОВ</h2></div>
          <div class="row2">
            <div>
              <label for="caughtDate">ДАТА</label>
              <input type="date" id="caughtDate">
            </div>
            <div>
              <label for="caughtTime">ВРЕМЯ</label>
              <input type="time" id="caughtTime" value="12:00">
            </div>
          </div>
          <label for="species">ВИД</label>
          <select id="species"><option value="">—</option></select>
          <label for="photo">ФОТО УЛОВА</label>
          <input type="file" id="photo" accept="image/*" onchange="onPhoto()">
          <img id="photoPreview" hidden alt="">
          <div id="fishIdResult"></div>
          <div class="row2">
            <div><label for="weight">ВЕС, КГ</label><input type="number" id="weight" min="0" step="0.01"></div>
            <div><label for="length">ДЛИНА, СМ</label><input type="number" id="length" min="0" step="1"></div>
          </div>
          <label for="notes">ПРИМЕЧАНИЕ</label>
          <textarea id="notes" rows="2"></textarea>
          <button class="btn" onclick="saveCatch()">СОХРАНИТЬ УЛОВ</button>
          <button class="btn ghost-ash" onclick="runRuleCheck()">ПРОВЕРИТЬ ПРАВИЛА</button>
          <div id="msg"></div>
        </section>

        <section class="card" id="ruleCard" hidden>
          <div class="card-head"><span class="badge">04</span><h2>ПРОВЕРКА ПРАВИЛ</h2></div>
          <div id="ruleCheck"></div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="card-head"><span class="badge">05</span><h2>ИСТОРИЯ УЛОВОВ</h2></div>
          <div id="catches"><div class="empty">ВЫБЕРИТЕ ТОЧКУ</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    let spots = [], species = [];

    async function get(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function localISO(dt) {
      const p = n => String(n).padStart(2, "0");
      return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
    }

    async function init() {
      try {
        spots = await get("/api/spots");
        document.getElementById("spot").innerHTML =
          spots.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
        species = await get("/api/species");
        document.getElementById("species").innerHTML =
          species.map(s => `<option value="${s.id}">${s.nameRu}</option>`).join("");
        document.getElementById("caughtDate").value = localISO(new Date());
        document.getElementById("spot").onchange();
      } catch (e) { showMsg("НЕ УДАЛОСЬ ЗАГРУЗИТЬ ДАННЫЕ: " + e.message, true); }
    }

    let currentSpot = null;
    async function onSpot() {
      const id = document.getElementById("spot").value;
      if (!id) return;
      currentSpot = id;
      const card = document.getElementById("forecastCard");
      try {
        const fc = await get("/api/spots/" + id + "/forecast");
        card.hidden = false;
        document.getElementById("forecast").innerHTML = renderForecast(fc);
      } catch (e) {
        card.hidden = false;
        document.getElementById("forecast").innerHTML = '<div class="empty">НЕТ ДАННЫХ ПРОГНОЗА</div>';
      }
      loadCatches();
    }

    function renderForecast(fc) {
      const start = fc.bestStart || "—", end = fc.bestEnd || "—";
      const what = fc.modelVersion === "ml-v1" ? "ML-МОДЕЛЬ" : "ПРАВИЛА";
      const segs = Array.from({ length: 10 }, (_, i) =>
        `<i class="${(i + 1) * 10 <= fc.score ? "on" : ""}"></i>`).join("");
      const sat = (fc.satellite || []).map(s =>
        `<div class="meta">• ${s.label.toUpperCase()}: <b>${s.value ?? "—"} ${s.unit}</b> — ${s.basis}${s.estimated ? ` · ДОСТ. ${s.confidence}%` : ""}</div>`).join("");
      return `<div class="score">
        <div class="num">${fc.score}</div>
        <div class="bar">${segs}</div>
      </div>
      <div class="meta">ДАТА: <b>${fc.date}</b></div>
      <div class="meta">ЛУЧШЕЕ ВРЕМЯ: <b>${start}–${end}</b></div>
      <div class="meta">ИСТОЧНИК: <b>${what}</b> · ${fc.modelVersion}</div>
      <div class="meta">ДОСТОВЕРНОСТЬ ДАННЫХ: <b>${fc.dataConfidence ?? "—"}%</b></div>
      ${sat}
      <div class="note">${fc.dataNote || ""}</div>`;
    }

    async function loadCatches() {
      const el = document.getElementById("catches");
      try {
        const rows = await get("/api/spots/" + currentSpot + "/catches");
        if (!rows.length) { el.innerHTML = '<div class="empty">УЛОВОВ ПОКА НЕТ</div>'; return; }
        el.innerHTML = `<table>
          <tr><th>КОГДА</th><th>ВИД</th><th>ВЕС</th><th>ДЛ.</th><th>ФОТО</th><th>ПРИМЕЧАНИЕ</th></tr>
          ${rows.map(r => `<tr>
            <td>${new Date(r.caughtAt).toLocaleString("ru-RU")}</td>
            <td class="sp">${r.speciesName || "—"}</td>
            <td>${r.weightKg ?? "—"}</td>
            <td>${r.lengthCm ?? "—"}</td>
            <td>${r.photoUrl ? `<img class="thumb" src="${r.photoUrl}" alt="">` : "—"}</td>
            <td>${r.notes || ""}</td></tr>`).join("")}
        </table>`;
      } catch (e) { el.innerHTML = '<div class="empty">ОШИБКА ЗАГРУЗКИ</div>'; }
    }

    function checkBody() {
      const date = document.getElementById("caughtDate").value;
      const time = document.getElementById("caughtTime").value;
      return {
        spotId: currentSpot,
        speciesId: document.getElementById("species").value || null,
        speciesName: document.getElementById("species").value ? null
          : (document.getElementById("species").selectedOptions[0]?.text || null),
        weightKg: document.getElementById("weight").value || null,
        lengthCm: document.getElementById("length").value || null,
        photoUrl: currentPhotoUrl,
        caughtAt: date + "T" + (time || "12:00") + ":00"
      };
    }

    let currentPhotoUrl = null;

    function onPhoto() {
      const f = document.getElementById("photo").files[0];
      if (!f) return;
      const preview = document.getElementById("photoPreview");
      preview.hidden = false;
      preview.src = URL.createObjectURL(f);
      showMsg("ОБРАБОТКА ФОТО…");
      const fd = new FormData();
      fd.append("file", f);
      Promise.all([
        fetch("/api/uploads", { method: "POST", body: fd }).then(r => r.ok ? r.json() : Promise.reject("UPLOAD")),
        fetch("/api/fish-id", { method: "POST", body: fd }).then(r => r.ok ? r.json() : Promise.reject("FISH-ID")),
      ]).then(([up, fid]) => {
        currentPhotoUrl = up.url;
        renderFishId(fid);
        showMsg("ФОТО ЗАГРУЖЕНО, ВИД ОПРЕДЕЛЁН");
      }).catch(e => showMsg("НЕ УДАЛОСЬ ОБРАБОТАТЬ ФОТО: " + e, true));
    }

    function findOption(value, text) {
      const sel = document.getElementById("species");
      return [...sel.options].find(o => o.value === value) || [...sel.options].find(o => o.text === text);
    }

    function renderFishId(fid) {
      const el = document.getElementById("fishIdResult");
      if (!fid.top || !fid.top.length) { el.innerHTML = '<div class="empty">ВИД НЕ ОПРЕДЕЛЁН</div>'; return; }
      const rows = fid.top.map(p => {
        const opt = findOption(p.speciesId, p.nameRu);
        const val = opt ? opt.value : "";
        return `<div class="fidrow" onclick="pickSpecies('${val}')">
          <span class="fidname">${p.nameRu}</span>
          <span class="fidconf">${(p.confidence * 100).toFixed(0)}%</span>
        </div>`;
      }).join("");
      el.innerHTML = `<div class="meta">МОДЕЛЬ: ${fid.modelVersion} · ВЫБЕРИТЕ ВАРИАНТ</div>${rows}`;
      const top = fid.top[0];
      const opt = findOption(top.speciesId, top.nameRu);
      if (opt) document.getElementById("species").value = opt.value;
    }

    function pickSpecies(id) {
      if (id) document.getElementById("species").value = id;
    }

    const CHECK_LABELS = {
      banned_species: "ЗАПРЕЩЁННЫЙ ВИД",
      season_ban: "СЕЗОННЫЙ ЗАПРЕТ",
      area_ban: "ЗАПРЕТ ПО УЧАСТКАМ",
      min_size: "МИНИМАЛЬНЫЙ РАЗМЕР",
      daily_limit: "СУТОЧНАЯ НОРМА",
    };

    function renderRuleCheck(r) {
      const card = document.getElementById("ruleCard");
      card.hidden = false;
      const violations = r.checks.filter(c => !c.ok);
      const rows = r.checks.map(c => `
        <div class="checkline">
          <span class="mk ${c.ok ? "" : "no"}">${c.ok ? "OK" : "!"}</span>
          <span class="ct ${c.ok ? "" : "rust"}">${CHECK_LABELS[c.type] || c.type}
            <span class="cm">${c.message}</span>
          </span>
        </div>`).join("");
      document.getElementById("ruleCheck").innerHTML = `
        <div class="verdict">
          <span class="badge ${r.allowed ? "" : "rust"}">${r.allowed ? "РАЗРЕШЕНО" : "ЕСТЬ НАРУШЕНИЯ"}</span>
          <span class="txt ${r.allowed ? "ok" : "viol"}">${r.allowed ? "МОЖНО ОСТАВИТЬ" : "ОСТАНОВИТЕСЬ"}</span>
        </div>
        <div class="summary">${r.summary}</div>
        ${rows}`;
    }

    async function runRuleCheck() {
      if (!currentSpot) return showMsg("СНАЧАЛА ВЫБЕРИТЕ ТОЧКУ", true);
      const body = checkBody();
      if (!body.speciesId && !body.speciesName) return showMsg("ВЫБЕРИТЕ ВИД", true);
      try {
        const r = await fetch("/api/rule-checks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          return showMsg("ПРОВЕРКА НЕВОЗМОЖНА: " + (err.error || r.status), true);
        }
        renderRuleCheck(await r.json());
        showMsg("ПРАВИЛА ПРОВЕРЕНЫ");
      } catch (e) { showMsg("ОШИБКА: " + e.message, true); }
    }

    async function saveCatch() {
      if (!currentSpot) return showMsg("СНАЧАЛА ВЫБЕРИТЕ ТОЧКУ", true);
      const body = checkBody();
      body.notes = document.getElementById("notes").value;
      try {
        const r = await fetch("/api/spots/" + currentSpot + "/catches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error(await r.text());
        showMsg("УЛОВ СОХРАНЁН");
        document.getElementById("weight").value = "";
        document.getElementById("length").value = "";
        document.getElementById("notes").value = "";
        loadCatches();
        runRuleCheck();
      } catch (e) { showMsg("ОШИБКА: " + e.message, true); }
    }

    function showMsg(text, isErr) {
      const m = document.getElementById("msg");
      m.textContent = text;
      m.className = isErr ? "err" : "ok";
    }

    init();
  </script>
</body>
</html>
