<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KLEVO — ЛЕНТА УЛОВОВ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-ember-rust: #cc6437;
      --color-void-black: #0b0b0b;
      --color-charcoal-surface: #272a2a;
      --color-bone: #edebe7;
      --color-bone-darker: #dfddd9;
      --color-pure-white: #ffffff;
      --color-abyss: #050505;
      --color-steel: #484848;
      --color-ash: #cecece;

      --font-pragmatica-cond: 'Barlow Condensed', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-pragmatica: 'Inter', ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-roboto-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --text-caption: 11px;
      --text-body-sm: 14px;
      --text-heading-sm: 20px;
      --text-heading: 24px;
      --text-heading-lg: 32px;
      --tracking: -0.02em;

      --spacing-5: 5px; --spacing-8: 8px; --spacing-11: 11px; --spacing-16: 16px;
      --spacing-20: 20px; --spacing-24: 24px; --spacing-32: 32px; --spacing-40: 40px;

      --radius-cards: 10px;
      --radius-full-2: 1440px;

      --page-max-width: 1400px;
    }

    * { box-sizing: border-box; }
    html { background: var(--color-void-black); }
    body {
      margin: 0;
      background: var(--color-void-black);
      color: var(--color-pure-white);
      font-family: var(--font-pragmatica-cond);
      font-weight: 400;
      letter-spacing: var(--tracking);
      line-height: 1.43;
      text-transform: uppercase;
    }

    .newsbar {
      background: var(--color-abyss);
      border-bottom: 1px solid var(--color-charcoal-surface);
      padding: 10px 20px;
      font-family: var(--font-roboto-mono);
      font-size: var(--text-caption);
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      color: var(--color-ash);
    }
    .newsbar b { color: var(--color-pure-white); font-weight: 400; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--spacing-20);
      padding: 40px 32px 24px;
      border-bottom: 1px solid var(--color-charcoal-surface);
    }
    @media (max-width: 720px) {
      header { flex-wrap: wrap; padding: 24px 16px; }
      .hdr-right { flex-basis: 100%; }
      nav.pills { flex-wrap: wrap; }
      main { padding: 24px 16px; }
      .card { padding: 16px; }
    }
    .hdr-right { display: flex; align-items: baseline; gap: var(--spacing-20); flex-wrap: wrap; }
    .brand { font-size: var(--text-heading-lg); line-height: 1.05; letter-spacing: -0.02em; }
    .brand .dot { color: var(--color-ember-rust); }
    .hdr-meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); color: var(--color-ash); letter-spacing: -0.02em; text-transform: uppercase; }

    nav.pills { display: flex; gap: var(--spacing-8); }
    nav.pills a {
      text-decoration: none;
      border: 1px solid var(--color-steel);
      border-radius: var(--radius-full-2);
      padding: 5px 14px;
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      color: var(--color-ash);
      text-transform: uppercase;
    }
    nav.pills a:hover { color: var(--color-pure-white); border-color: var(--color-pure-white); }
    nav.pills a.active { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }

    main { max-width: var(--page-max-width); margin: 0 auto; padding: 40px 32px; }

    .card {
      background: var(--color-charcoal-surface);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-charcoal-surface);
      padding: var(--spacing-24);
      box-shadow: none;
    }
    .card-head { display: flex; align-items: center; gap: var(--spacing-11); margin-bottom: var(--spacing-20); }
    .card-head h2 { margin: 0; font-size: var(--text-heading-sm); line-height: 1; letter-spacing: -0.02em; font-weight: 400; }

    .badge {
      display: inline-block;
      border: 1px solid var(--color-ash);
      border-radius: var(--radius-full-2);
      padding: 5px 11px;
      font-size: var(--text-body-sm);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--color-pure-white);
      text-transform: uppercase;
    }
    .badge.rust { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }

    .toolbar { display: flex; align-items: center; gap: var(--spacing-16); margin-bottom: var(--spacing-20); flex-wrap: wrap; }
    .btn {
      display: inline-block; cursor: pointer; text-decoration: none;
      background: transparent;
      border: 1px solid var(--color-steel);
      border-radius: var(--radius-full-2);
      padding: 6px 14px;
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      color: var(--color-ash);
      text-transform: uppercase;
    }
    .btn:hover { color: var(--color-pure-white); border-color: var(--color-pure-white); }
    .btn.on { border-color: var(--color-ember-rust); color: var(--color-ember-rust); }

    .feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1100px) { .feed { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .feed { grid-template-columns: 1fr; } }

    .fc {
      background: var(--color-charcoal-surface);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-charcoal-surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .fc .ph {
      aspect-ratio: 4 / 3;
      background: var(--color-void-black);
      border-bottom: 1px solid var(--color-charcoal-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-roboto-mono);
      font-size: var(--text-caption);
      letter-spacing: -0.02em;
      color: var(--color-ash);
    }
    .fc .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fc .bd { padding: var(--spacing-16); display: grid; gap: var(--spacing-11); }
    .fc .sp { font-size: var(--text-heading-sm); line-height: 1.05; letter-spacing: -0.02em; }
    .fc .meta { font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; color: var(--color-ash); text-transform: uppercase; }
    .fc .meta b { color: var(--color-pure-white); font-weight: 400; }
    .fc .note { font-family: var(--font-pragmatica); font-size: 13px; line-height: 1.4; text-transform: none; color: var(--color-ash); }
    .fc .ft { margin-top: 4px; border-top: 1px solid var(--color-steel); padding-top: var(--spacing-11); display: flex; align-items: center; gap: var(--spacing-11); flex-wrap: wrap; }
    .fc a.go {
      margin-left: auto;
      font-family: var(--font-pragmatica-cond);
      font-size: var(--text-body-sm);
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--color-pure-white);
      border-bottom: 1px solid var(--color-ember-rust);
    }
    .fc a.go:hover { color: var(--color-ember-rust); }

    .empty { color: var(--color-ash); font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; padding: 12px 0; }
    .err { color: var(--color-ember-rust); font-family: var(--font-roboto-mono); font-size: var(--text-caption); letter-spacing: -0.02em; padding: 12px 0; }
  </style>
</head>
<body>
  <div class="newsbar"><b>KLEVO</b> • AI-ПРОГНОЗ КЛЁВА • ИНСПЕКТОР УЛОВА • ЗАПАДНЫЙ БАССЕЙН • ЛЕНОБЛАСТЬ • ПИЛОТ 2026</div>

  <header>
    <div class="brand">KLEVO<span class="dot">.</span></div>
    <div class="hdr-right">
      <nav class="pills">
        <a href="/">ЖУРНАЛ</a>
        <a href="/map.html">КАРТА</a>
        <a href="/feed.html" class="active">ЛЕНТА</a>
      </nav>
      <div class="hdr-meta">ЛЕНТА УЛОВОВ · RULE-CHECK V1</div>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head"><span class="badge">01</span><h2>ЛЕНТА УЛОВОВ</h2></div>
      <div class="toolbar">
        <button class="btn" id="photoOnly" onclick="togglePhotoOnly()">ТОЛЬКО С ФОТО</button>
        <button class="btn" id="refresh" onclick="load()">ОБНОВИТЬ</button>
      </div>
      <div id="feed"><div class="empty">ЗАГРУЗКА…</div></div>
    </section>
  </main>

  <script>
    const WT = { river: "РЕКА", lake: "ОЗЕРО", sea: "МОРЕ / ЗАЛИВ" };
    let photoOnly = false;

    async function get(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function fmtDate(iso) {
      return new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function cardHtml(c) {
      const photo = c.photoUrl
        ? `<div class="ph"><img src="${esc(c.photoUrl)}" alt="" loading="lazy"></div>`
        : `<div class="ph">БЕЗ ФОТО</div>`;
      const rule = c.rule
        ? `<span class="badge ${c.rule.allowed ? "" : "rust"}">${c.rule.allowed ? "РАЗРЕШЕНО" : "ЕСТЬ НАРУШЕНИЯ"}</span>
           <span class="meta">${c.rule.violations > 0 ? c.rule.violations + " НАРУШ." : "0 НАРУШ."}</span>`
        : `<span class="badge rust">ПРОВЕРКА НЕДОСТУПНА</span>`;
      return `<div class="fc">
        ${photo}
        <div class="bd">
          <div class="sp">${esc(c.speciesName || "—")}</div>
          <div class="meta">${WT[c.waterType] || c.waterType || "—"} · <b>${esc(c.spotName || "—")}</b></div>
          <div class="meta">КОГДА: <b>${fmtDate(c.caughtAt)}</b></div>
          <div class="meta">ВЕС: <b>${c.weightKg ?? "—"} кг</b> · ДЛ.: <b>${c.lengthCm ?? "—"} см</b></div>
          ${c.notes ? `<div class="note">${esc(c.notes)}</div>` : ""}
          <div class="ft">
            ${rule}
            <a class="go" href="/?spot=${c.spotId}">В ЖУРНАЛ →</a>
          </div>
        </div>
      </div>`;
    }

    function togglePhotoOnly() {
      photoOnly = !photoOnly;
      document.getElementById("photoOnly").classList.toggle("on", photoOnly);
      render();
    }

    let items = [];
    function render() {
      const el = document.getElementById("feed");
      const rows = photoOnly ? items.filter(c => c.photoUrl) : items;
      el.innerHTML = rows.length
        ? rows.map(cardHtml).join("")
        : '<div class="empty">УЛОВОВ НЕТ</div>';
    }

    async function load() {
      const el = document.getElementById("feed");
      el.innerHTML = '<div class="empty">ЗАГРУЗКА…</div>';
      try {
        items = (await get("/api/catches/feed?limit=100")).items || [];
        render();
      } catch (e) {
        el.innerHTML = '<div class="err">ОШИБКА: ' + esc(e.message) + '</div>';
      }
    }

    load();
  </script>
</body>
</html>
